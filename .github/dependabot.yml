version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates arrive together in one PR. Major versions come as
    # separate PRs, so one breaking tool can't block every other update.
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    ignore:
      # Blocked upstream; remove when supported:
      # eslint-plugin-react doesn't support ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript up to 6.0.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
