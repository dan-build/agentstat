name: Feature request
description: An integration, prop or behavior you need.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: Optional — an API sketch or example.
