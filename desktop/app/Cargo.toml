[package]
name = "agentstat-app"
version = "0.0.0"
description = "The AgentStat desktop app: every agent on this machine, live."
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "agentstat-app"
path = "src/main.rs"

[dependencies]
agentstat-core = { path = "../core" }
futures = "0.3"
# runtime_shaders: Metal shaders compile at launch, so building needs no Xcode.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
